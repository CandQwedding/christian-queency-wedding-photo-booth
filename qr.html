<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3024">
<title>Wedding Photo Booth QR | Christian & Queency</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="qr-page">
<main class="qr-card">
<div class="monogram">C <span>&amp;</span> Q</div>
<p class="eyebrow">Christian &amp; Queency · 10 October 2026</p>
<h1>Scan &amp; share<br><span class="script">a memory</span></h1>
<div id="qrcode" aria-label="QR code for the wedding photo booth"></div>
<p class="qr-instructions">Guests can scan this code with their phone camera. It opens the wedding photo booth where they can take, redo, and submit a framed photo.</p>
<p class="qr-url" id="qrUrl"></p>
<a class="button dark" href="photo.html">Open photo booth ↗</a>
</main>
<script>
const target = new URL('photo.html', window.location.href).href;
document.getElementById('qrUrl').textContent = target;
new QRCode(document.getElementById('qrcode'), {
  text: target,
  width: 226,
  height: 226,
  colorDark: '#4a3024',
  colorLight: '#fff8ee',
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
